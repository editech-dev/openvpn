name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:stable -x \
            openvpn/entrypoint.sh openvpn/ovpnctl openvpn/healthcheck.sh openvpn/duckdns.sh openvpn/lib/*.sh scripts/*.sh tests/*.sh
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: openvpn/Dockerfile
      - name: compose config
        run: docker compose --env-file .env.example config -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact --verbose

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/code:ro" -w /code bats/bats:latest -r tests/unit

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v7
      - name: Prueba end-to-end
        run: ./tests/smoke.sh
      - name: Actualización automática, vuelta atrás y avisos
        run: ./tests/autoupdate.sh
      - name: Trivy (vulnerabilidades de la imagen)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/editech-dev/openvpn:smoke
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
