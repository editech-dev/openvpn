# Despliegue: cp .env.example .env && editar && docker compose up -d
# Todas las variables están documentadas en .env.example y docs/CONFIG.md.

# Nombre fijo: el volumen de la PKI se llama siempre openvpn_ovpn-data, aunque la
# carpeta se renombre. Se puede cambiar con COMPOSE_PROJECT_NAME o "-p".
name: openvpn

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  openvpn:
    image: ghcr.io/editech-dev/openvpn:${OVPN_IMAGE_TAG:-latest}
    build:
      context: ./openvpn
    pull_policy: ${OVPN_PULL_POLICY:-missing}
    restart: unless-stopped
    ports:
      - "${OVPN_PORT:-1194}:1194/${OVPN_PROTO:-udp}"
    environment:
      TZ: ${TZ:-UTC}
      DUCKDNS_SUBDOMAINS: ${DUCKDNS_SUBDOMAINS:-}
      OVPN_HOSTNAME: ${OVPN_HOSTNAME:-}
      OVPN_PORT: ${OVPN_PORT:-}
      OVPN_PROTO: ${OVPN_PROTO:-}
      OVPN_NETWORK: ${OVPN_NETWORK:-}
      OVPN_DNS: ${OVPN_DNS:-}
      OVPN_REDIRECT_GATEWAY: ${OVPN_REDIRECT_GATEWAY:-}
      OVPN_PUSH_ROUTES: ${OVPN_PUSH_ROUTES:-}
      OVPN_USERS: ${OVPN_USERS:-}
      OVPN_REVOKE_REMOVED: ${OVPN_REVOKE_REMOVED:-}
      OVPN_CLIENT_CERT_DAYS: ${OVPN_CLIENT_CERT_DAYS:-}
      OVPN_SERVER_CERT_DAYS: ${OVPN_SERVER_CERT_DAYS:-}
      OVPN_CA_DAYS: ${OVPN_CA_DAYS:-}
      OVPN_CA_CN: ${OVPN_CA_CN:-}
      OVPN_CIPHERS: ${OVPN_CIPHERS:-}
      OVPN_CLIENT_TO_CLIENT: ${OVPN_CLIENT_TO_CLIENT:-}
      OVPN_EXTRA_SERVER_CONFIG: ${OVPN_EXTRA_SERVER_CONFIG:-}
      OVPN_VERB: ${OVPN_VERB:-}
      OVPN_CLIENT_PERSIST_TUN: ${OVPN_CLIENT_PERSIST_TUN:-}
    volumes:
      - ovpn-data:/etc/openvpn
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
    # Mínimo privilegio: solo las capacidades necesarias.
    cap_drop: [ALL]
    # KILL: tini (root) debe poder reenviar SIGTERM a openvpn, que corre como nobody.
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, SETPCAP, CHOWN, FOWNER, KILL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging: *logging

  duckdns:
    # Misma imagen que openvpn, en modo "duckdns": actualiza la IP pública cada
    # DUCKDNS_INTERVAL segundos. Se activa con COMPOSE_PROFILES=duckdns (ver .env.example).
    # Si usas otro DNS dinámico o IP fija, quita el perfil y define OVPN_HOSTNAME.
    image: ghcr.io/editech-dev/openvpn:${OVPN_IMAGE_TAG:-latest}
    build:
      context: ./openvpn
    pull_policy: ${OVPN_PULL_POLICY:-missing}
    profiles: [duckdns]
    command: ["duckdns"]
    restart: unless-stopped
    user: "65534:65534"
    environment:
      TZ: ${TZ:-UTC}
      DUCKDNS_SUBDOMAINS: ${DUCKDNS_SUBDOMAINS:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
      DUCKDNS_TOKEN_FILE: ${DUCKDNS_TOKEN_FILE:-}
      DUCKDNS_INTERVAL: ${DUCKDNS_INTERVAL:-300}
      DUCKDNS_URL: ${DUCKDNS_URL:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "duckdns"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      start_interval: 3s
      retries: 2
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 32M
    logging: *logging

volumes:
  ovpn-data:
