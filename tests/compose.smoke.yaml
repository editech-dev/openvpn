# Overlay para pruebas: no publica puertos y añade un cliente OpenVPN real.
# El servidor usa una IP fija (SMOKE_SERVER_IP) para poder simular un cambio de IP
# bajo el mismo nombre, como ocurre con DuckDNS.
services:
  openvpn:
    ports: !reset []
    networks:
      vpnnet:
        ipv4_address: ${SMOKE_SERVER_IP:-172.30.99.10}

  duckdns:
    networks: [vpnnet]

  # Servidor HTTP simulado (DuckDNS y Telegram) para no depender de servicios reales.
  mock:
    image: ${SMOKE_MOCK_IMAGE:-ghcr.io/editech-dev/openvpn:smoke}
    pull_policy: never
    profiles: [test]
    entrypoint: ["socat", "TCP-LISTEN:80,fork,reuseaddr", "SYSTEM:/mock/mock-http.sh"]
    volumes:
      - ${SMOKE_MOCK_DIR:?}:/mock
    ports:
      - "127.0.0.1:${SMOKE_MOCK_PORT:-18080}:80"
    networks: [vpnnet]

  client:
    image: ghcr.io/editech-dev/openvpn:smoke
    pull_policy: never
    profiles: [test]
    depends_on: [openvpn]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${SMOKE_CLIENT_DIR:?}:/client:ro
    networks: [vpnnet]
    command: ["openvpn", "--config", "/client/client.ovpn"]

networks:
  vpnnet:
    ipam:
      config:
        - subnet: 172.30.99.0/24
